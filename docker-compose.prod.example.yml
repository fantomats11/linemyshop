services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-line_myshop}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-line_myshop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      LINE_MYSHOP_MOCK_MODE: ${LINE_MYSHOP_MOCK_MODE:-true}
      LINE_MYSHOP_BASE_URL: ${LINE_MYSHOP_BASE_URL:-}
      LINE_MYSHOP_API_KEY: ${LINE_MYSHOP_API_KEY:-}
      LINE_MYSHOP_API_KEY_HEADER: ${LINE_MYSHOP_API_KEY_HEADER:-X-API-KEY}
      LINE_MYSHOP_CREATE_PRODUCT_PATH: ${LINE_MYSHOP_CREATE_PRODUCT_PATH:-/myshop/v1/products}
      LINE_MYSHOP_UPDATE_PRODUCT_PATH: ${LINE_MYSHOP_UPDATE_PRODUCT_PATH:-/myshop/v1/products/{external_product_id}}
      LINE_MYSHOP_UPDATE_INVENTORY_PATH: ${LINE_MYSHOP_UPDATE_INVENTORY_PATH:-}
      LINE_MYSHOP_UPDATE_PRICE_PATH: ${LINE_MYSHOP_UPDATE_PRICE_PATH:-}
      LINE_MYSHOP_DEFAULT_CATEGORY_ID: ${LINE_MYSHOP_DEFAULT_CATEGORY_ID:-}
      LINE_MYSHOP_DEFAULT_BRAND: ${LINE_MYSHOP_DEFAULT_BRAND:-CO COAT}
      LINE_MYSHOP_DEFAULT_WEIGHT: ${LINE_MYSHOP_DEFAULT_WEIGHT:-1}
      LINE_MYSHOP_SEPARATE_VARIANT_SYNC: ${LINE_MYSHOP_SEPARATE_VARIANT_SYNC:-false}
      WORDPRESS_BASE_URL: ${WORDPRESS_BASE_URL:-}
      WORDPRESS_USERNAME: ${WORDPRESS_USERNAME:-}
      WORDPRESS_APPLICATION_PASSWORD: ${WORDPRESS_APPLICATION_PASSWORD:-}
      IMAGE_GENERATION_PROVIDER: ${IMAGE_GENERATION_PROVIDER:-manual}
      FAL_KEY: ${FAL_KEY:-}
      FAL_IMAGE_MODEL: ${FAL_IMAGE_MODEL:-openai/gpt-image-2/edit}
      FAL_IMAGE_QUALITY: ${FAL_IMAGE_QUALITY:-medium}
      FAL_IMAGE_SIZE: ${FAL_IMAGE_SIZE:-square}
      FAL_IMAGE_FORMAT: ${FAL_IMAGE_FORMAT:-jpeg}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
