services:
  postgres:
    image: postgres:16-alpine
    container_name: line-myshop-postgres
    environment:
      POSTGRES_DB: line_myshop
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d line_myshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
